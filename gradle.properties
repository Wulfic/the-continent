# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Acknowledges Stonecutter's notice that it prefers Kotlin build scripts. Ours stay Groovy, like the rest.
dev.kikugie.stonecutter.hard_mode=true

# Fabric Properties - pinned 2026-10-20 from meta.fabricmc.net, maven.fabricmc.net and the
# FabricMC/fabric-example-mod 26.x branches. Never bump from memory.
# loom: 26.x ships unobfuscated, so the plugin id is net.fabricmc.fabric-loom (no remapping, no
# mappings). The template pins 1.18-SNAPSHOT with Gradle 9.7.1; 1.18.4 is that line's release.
loader_version=0.19.5
loom_version=1.18.4

# Per band. A band is a Stonecutter node (settings.gradle), named after the Minecraft version it compiles
# against. fabric_api: the newest build for that version. minecraft_range: what the jar declares it runs on.
# band_label: the band in the jar's name (the_continent-<version>+fabric-mc<label>.jar). BandLabelTest holds
# the label and the range to each other.
fabric_api_version.26.1.2=0.155.3+26.1.2
minecraft_range.26.1.2=>=26.1 <26.2
band_label.26.1.2=26.1
fabric_api_version.26.2=0.161.0+26.2
minecraft_range.26.2=>=26.2 <26.3
band_label.26.2=26.2
fabric_api_version.26.3=0.164.0+26.3
minecraft_range.26.3=>=26.3 <26.4
band_label.26.3=26.3

# NeoForge - pinned 2026-10-20 from maven.neoforged.net and the NeoForgeMDKs/MDK-26.3-ModDevGradle template.
# NeoForge has no stable build for 26.1 or 26.1.1, so its 26.1 jar runs on 26.1.2 alone, and is labelled so.
moddev_version=2.0.148
neoforge_version.26.1.2=26.1.2.122
neoforge_minecraft_range.26.1.2=[26.1.2,26.2)
neoforge_band_label.26.1.2=26.1.2
neoforge_version.26.2=26.2.0.93
neoforge_minecraft_range.26.2=[26.2,26.3)
neoforge_band_label.26.2=26.2
neoforge_version.26.3=26.3.0.95
neoforge_minecraft_range.26.3=[26.3,26.4)
neoforge_band_label.26.3=26.3

# Forge - pinned 2026-10-20 from files.minecraftforge.net promotions (recommended where there is one; 26.3 has
# only latest), the Gradle Plugin Portal and Forge's 26.3 MDK. Forge publishes one major per Minecraft release,
# so its 26.1 jar runs on 26.1.2 alone, and is labelled so. Forge loads a mod's data only with a pack.mcmeta;
# forge_pack_format is the band's data pack major (version.json in its Minecraft jar), as Forge's MDK writes it.
forgegradle_version=7.0.40
forge_version.26.1.2=64.1.0
forge_minecraft_range.26.1.2=[26.1.2,26.2)
forge_band_label.26.1.2=26.1.2
forge_pack_format.26.1.2=101
forge_version.26.2=65.1.0
forge_minecraft_range.26.2=[26.2,26.3)
forge_band_label.26.2=26.2
forge_pack_format.26.2=107
forge_version.26.3=66.0.13
forge_minecraft_range.26.3=[26.3,26.4)
forge_band_label.26.3=26.3
forge_pack_format.26.3=121

# Server smoke (tools/smoke_band.py): each band's jars boot on a real server of the band's floor version.
# smoke_floor: the lowest Minecraft the band's Fabric jar declares. smoke_fabric_api: the newest Fabric API for
# that floor (26.1.2's Fabric API won't load on 26.1). quilt_loader: Quilt runs the Fabric jar; it has only betas.
smoke_floor.26.1.2=26.1
smoke_fabric_api.26.1.2=0.145.1+26.1
smoke_floor.26.2=26.2
smoke_fabric_api.26.2=0.161.0+26.2
smoke_floor.26.3=26.3
smoke_fabric_api.26.3=0.164.0+26.3
quilt_loader_version=0.31.0-beta.4

# Mod Properties
version=1.0.0
group=com.wulfic.continent

# Dependencies
junit_version=5.14.4
